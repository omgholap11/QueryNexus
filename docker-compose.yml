version: '3.8'

services:
  # ----------------------------------------------------------------
  # 1. REDIS (Cache & Deduplication)
  # ----------------------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: redis_stack
    ports:
      - "6379:6379"    # Internal Redis Port
      - "8001:8001"    # Redis Insight GUI
    volumes:
      - ./infra_data/redis:/data 
    restart: always
    networks:
      - news_network

  # ----------------------------------------------------------------
  # 2. KAFKA (KRaft Mode - No Zookeeper!)
  # ----------------------------------------------------------------
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft Settings
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_KRAFT_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk # Just a random UUID
      
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - ./infra_data/kafka:/bitnami/kafka # Persist Kafka Data
    networks:
      - news_network
    restart: always

  # ----------------------------------------------------------------
  # 3. PRODUCER SERVICE (Python)
  # ----------------------------------------------------------------
  news_producer:
    build: .
    container_name: news_producer
    command: python -m Backend.Kafka.Workers.producer
    depends_on:
      - kafka
      - redis
    environment:
      # Note: We connect to the Service Name 'kafka'
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - news_network
    restart: always

  # ----------------------------------------------------------------
  # 4. CONSUMER SERVICE (Python)
  # ----------------------------------------------------------------
  news_consumer:
    build: .
    container_name: news_consumer
    command: python -m Backend.Kafka.Workers.consumer
    depends_on:
      - kafka
      - redis
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - news_network
    restart: always

networks:
  news_network:
    driver: bridge